# Standalone reverse proxy for PULSAR (only if you have no central proxy). HTTPS only: port 80 just redirects.
# Put the certificate and key in nginx/ssl/ (cert.pem, key.pem). nginx refuses to start without them.
# The backend sets the application security headers (CSP, HSTS, X-Frame-Options, ...); they are not repeated here.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    upstream pulsar_backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:pulsar_tls:10m;

        # API requests are small; the largest are rule and saved-search bodies.
        client_max_body_size 1m;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        # Long enough for the MCP SSE stream to stay open between events.
        proxy_read_timeout 300s;

        location / {
            proxy_pass http://pulsar_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Replace, do not append: the backend trusts this header only from TRUSTED_PROXIES and reads it
            # right to left, so a client-supplied value must not survive this hop.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }
}
