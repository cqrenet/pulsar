# Images are pinned by digest; Dependabot proposes updates (.github/dependabot.yml).
# Required in .env: MONGO_APP_PASSWORD, REDIS_PASSWORD. Required in .env.db: MONGO_INITDB_ROOT_USERNAME / _PASSWORD
# (generate each with: openssl rand -hex 32), plus secrets/pulsar-ingestion.pem (see DEPLOY.md).
services:
  redis:
    image: valkey/valkey:8-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
    container_name: pulsar-redis
    restart: always
    # Command must start with valkey-server so the image's entrypoint still drops root privileges.
    command: ["valkey-server", "/usr/local/etc/valkey/valkey.conf"]
    configs:
      - source: valkey_conf
        target: /usr/local/etc/valkey/valkey.conf
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}  # read by valkey-cli in the healthcheck; keeps the password out of process args
    volumes:
      - redis_data:/data
    networks:
      - pulsar-internal
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  mongo:
    image: mongo:7@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4
    container_name: pulsar-mongo
    restart: always
    # Do NOT expose MongoDB port to the host in production
    # Root credentials come from .env.db, which only this container reads.
    env_file:
      - .env.db
    environment:
      # Used by deploy/mongo-init to create the least-privilege "pulsar" user
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
      - ./deploy/mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - pulsar-internal
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ghcr.io/cqrenet/pulsar:${PULSAR_VERSION:-latest}
    container_name: pulsar-backend
    restart: always
    env_file:
      - .env
    environment:
      # The app connects as "pulsar" (readWrite on events, insert-only on the audit trail), never as root.
      MONGO_URI: mongodb://pulsar:${MONGO_APP_PASSWORD}@mongo:27017/?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CLIENT_CERTIFICATE_PATH: /run/secrets/pulsar_ingestion_cert
      HOME: /tmp
    secrets:
      - pulsar_ingestion_cert
    # Runtime hardening: nothing in the image needs to write outside /tmp or hold extra privileges.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pulsar-internal  # MongoDB and Valkey
      - pulsar-edge  # published port and outbound access to Microsoft (Graph, Entra login)
    ports:
      # Bind to localhost only — always place behind a reverse proxy.
      # Your reverse proxy (nginx, Traefik, Caddy, Application Gateway, etc.)
      # should handle TLS termination and forward to this port.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

configs:
  valkey_conf:
    # Password in a mounted file, not on the command line, where any host user could read it with ps.
    content: |
      requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}

secrets:
  pulsar_ingestion_cert:
    # Private key + certificate of the ingestion app. Owned by uid 10001 (the container user), mode 400.
    file: ./secrets/pulsar-ingestion.pem

volumes:
  mongo_data:
  redis_data:

networks:
  # No external connectivity: only mongo, redis and the backend can talk here.
  pulsar-internal:
    internal: true
  # The backend needs a normal network: Docker cannot publish ports from, or route outbound traffic out of,
  # an internal-only network, and ingestion must reach Microsoft.
  pulsar-edge:
