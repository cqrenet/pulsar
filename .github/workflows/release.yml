name: Release

on:
  push:
    tags:
      - "v*"
  # Re-run only the GitHub Release step for an existing tag (for example, to backfill notes). The image build is
  # skipped, so an existing image is never rebuilt or overwritten.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v3.1.3"
        required: true
        type: string

jobs:
  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build ./backend \
            --build-arg VERSION=${{ github.ref_name }} \
            --tag ghcr.io/cqrenet/pulsar:${{ github.ref_name }}

      - name: Scan image with Trivy (blocks the release on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress \
            ghcr.io/cqrenet/pulsar:${{ github.ref_name }}

      - name: Tag as latest
        run: docker tag ghcr.io/cqrenet/pulsar:${{ github.ref_name }} ghcr.io/cqrenet/pulsar:latest

      - name: Push version tag
        run: docker push ghcr.io/cqrenet/pulsar:${{ github.ref_name }}

      - name: Push latest
        run: docker push ghcr.io/cqrenet/pulsar:latest

  github-release:
    # Runs after a successful build, or on a manual re-run. Skipped if the build failed or the scan blocked it.
    needs: build-and-push
    if: ${{ always() && needs.build-and-push.result != 'failure' && needs.build-and-push.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Build release notes from CHANGELOG.md (fails if the section is missing)
        run: python3 scripts/release-notes.py "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Create the GitHub Release (skipped if it already exists)
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          # Only a new tag from a push becomes "Latest"; a manual re-run of an older tag must not.
          LATEST_FLAG="--latest=false"
          if [ "${{ github.event_name }}" = "push" ]; then LATEST_FLAG="--latest"; fi
          gh release create "$TAG" --verify-tag --title "PULSAR $TAG" --notes-file "$RUNNER_TEMP/notes.md" $LATEST_FLAG
